name: Sync fork with upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to upstream and re-apply fork workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          preserve="${RUNNER_TEMP}/fork-preserve"
          mkdir -p "${preserve}"
          cp -a .github/workflows "${preserve}/workflows"
          cp -a scripts "${preserve}/scripts" 2>/dev/null || true

          git fetch origin main
          git remote add upstream https://github.com/openclaw/openclaw.git || \
            git remote set-url upstream https://github.com/openclaw/openclaw.git
          git fetch upstream main

          git reset --hard upstream/main

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "${preserve}/workflows/." .github/workflows/
          rm -rf scripts
          cp -a "${preserve}/scripts" scripts 2>/dev/null || true

          git add .github/workflows
          git add scripts 2>/dev/null || true
          git diff --cached --quiet || git commit -m "fork: maintain upstream sync workflows"

          git push --force-with-lease origin HEAD:main
